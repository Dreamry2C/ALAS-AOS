name: rootfs

on:
  workflow_dispatch:
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/rootfs.yml'

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          df -h

      - name: Build rootfs
        run: bash rootfs/build/build-rootfs.sh

      # OCR 门禁已内联进 build-rootfs.sh（import 硬门禁：import mxnet 会 dlopen libmxnet.so，
      # 顺带验 openblas/opencv apt 库 + numpy_shim；构建期 chroot 内执行）。
      # 原 Spike F PP-OCR 门禁随 PP-OCR 退役一并移除。

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
          retention-days: 14
