name: app

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare project-local temporary directory
        run: mkdir -p .tmp/ci
      - name: Python regressions (bridge, native control, updater and seeds)
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/ci
        run: python -m unittest discover -s rootfs/tests -v
      - name: Runtime asset consistency (overlay, patches and seeds)
        run: python app/scripts/check_asset_sync.py
      - name: Translation consistency
        run: python app/scripts/check_i18n_strings.py

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare project-local temporary directory
        run: mkdir -p .tmp/ci
      - name: Cache bundled rootfs
        id: cache-rootfs
        uses: actions/cache@v4
        with:
          path: app/app/src/main/assets/rootfs/rootfs.tar.xz
          key: rootfs-tar-xz-v0.1.6
      - name: Prepare bundled rootfs asset
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/app/src/main/assets/rootfs
          if [ ! -f "app/app/src/main/assets/rootfs/rootfs.tar.xz" ]; then
            echo "Downloading baseline APK to extract rootfs.tar.xz..."
            curl -L -o .tmp/baseline.apk https://github.com/Shinarin/ALAS-AOS/releases/download/v0.1.6/ALAS-AOS-v0.1.6-android-arm64.apk
            unzip -p .tmp/baseline.apk assets/rootfs/rootfs.tar.xz > app/app/src/main/assets/rootfs/rootfs.tar.xz
            rm -f .tmp/baseline.apk
          fi
          ls -lh app/app/src/main/assets/rootfs/rootfs.tar.xz
      - name: Build APKs (Release & Debug)
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/ci
        run: bash app/gradlew -p app :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon --console=plain
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALAS-AOS-apk
          path: |
            app/app/build/outputs/apk/release/app-release.apk
            app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: |
            app/app/build/test-results/
            app/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/app/build/outputs/apk/release/app-release.apk
            app/app/build/outputs/apk/debug/app-debug.apk

