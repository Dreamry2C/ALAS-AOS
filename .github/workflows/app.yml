name: app

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare project-local temporary directory
        run: mkdir -p .tmp/ci
      - name: Python regressions (bridge, native control, updater and seeds)
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/ci
        run: python -m unittest discover -s rootfs/tests -v
      - name: Runtime asset consistency (overlay, patches and seeds)
        run: python app/scripts/check_asset_sync.py
      - name: Translation consistency
        run: python app/scripts/check_i18n_strings.py

  rootfs:
    needs: checks
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rootfs.yml

  build:
    needs: rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/.tmp/signing/release.keystore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare project-local temporary directory
        run: mkdir -p .tmp/ci
      - name: Restore and verify release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 app/scripts/release_identity.py prepare
      - name: Download rootfs built and validated in this run
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .tmp/rootfs-dist
      - name: Prepare bundled rootfs asset
        run: |
          mkdir -p app/app/src/main/assets/rootfs
          xz --test .tmp/rootfs-dist/rootfs.tar.xz
          cp .tmp/rootfs-dist/rootfs.tar.xz .tmp/rootfs-dist/BUILD_MANIFEST app/app/src/main/assets/rootfs/
      - name: Kotlin unit tests
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/ci
        run: bash app/gradlew -p app :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/ci
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash app/gradlew -p app :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK signing certificate and version
        if: github.event_name != 'pull_request'
        run: python3 app/scripts/release_identity.py verify
      - name: Remove temporary signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f -- "$KEYSTORE_PATH"
      - name: Verify bundled rootfs and report APK size
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          assets = Path('app/app/src/main/assets/rootfs')
          def digest(stream):
              return hashlib.file_digest(stream, 'sha256').hexdigest()

          with (assets / 'rootfs.tar.xz').open('rb') as stream:
              rootfs_sha = digest(stream)
          manifest = (assets / 'BUILD_MANIFEST').read_bytes()
          rows = ['| Package | MiB | SHA256 |', '| --- | ---: | --- |']
          apk = Path('app/app/build/outputs/apk/release/app-release.apk')
          with zipfile.ZipFile(apk) as archive:
              with archive.open('assets/rootfs/rootfs.tar.xz') as stream:
                  assert digest(stream) == rootfs_sha, 'rootfs differs from this run'
              assert archive.read('assets/rootfs/BUILD_MANIFEST') == manifest, 'manifest mismatch'
          with apk.open('rb') as stream:
              apk_sha = digest(stream)
          size = apk.stat().st_size / 1024**2
          rows.append(f'| {apk.name} | {size:.2f} | `{apk_sha}` |')
          report = '\n'.join(rows) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Download **ALAS-AOS-release** for installation.\n\n')
              summary.write(report)
          PY
      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ALAS-AOS-release
          path: app/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: |
            app/app/build/test-results/
            app/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/app/build/outputs/apk/release/app-release.apk

